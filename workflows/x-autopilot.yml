name: PromptShift X (Twitter) Autonomous DevRel

on:
  schedule:
    # 14:30 UTC (15:30 CET / 10:30 AM EST - EU Afternoon & US East Morning Peak)
    # 19:30 UTC (20:30 CET / 03:30 PM EST / 12:30 PM PST - EU Evening & US West Peak)
    - cron: '30 14,19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate broadcast without hitting X API'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚡ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🚀 Run Autonomous DevRel Engine (@promptshift_dev + @jeanyvesgarcin Repost)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_3K_API_KEY: ${{ secrets.X_3K_API_KEY }}
          X_3K_API_SECRET: ${{ secrets.X_3K_API_SECRET }}
          X_3K_ACCESS_TOKEN: ${{ secrets.X_3K_ACCESS_TOKEN }}
          X_3K_ACCESS_TOKEN_SECRET: ${{ secrets.X_3K_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          node --experimental-strip-types scripts/x-autopilot.ts

      - name: 💾 Commit & Sync Broadcast History
        run: |
          git config user.name "PromptShift Autopilot [bot]"
          git config user.email "bot@promptshift.dev"
          git add data/x_posts_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): record x devrel broadcast [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No history update to commit."
          fi
