name: 'PromptShift AI Rules Transpiler & AST Parity Guard'
description: 'Bi-directional AST transpiler & secret sanitization guard for AI coding assistants (Cursor, Claude Code, Windsurf, Copilot).'
author: 'PromptShift Engineering Team <contact@promptshift.dev>'

inputs:
  target:
    description: 'Target AI ecosystem to transpile to (claude, cursor, openai, gemini)'
    required: false
    default: 'claude'
  key:
    description: 'Polar.sh Order ID or Pro Developer License Key (unlocks >2 files & automated CI workflows)'
    required: false
    default: ''
  check_only:
    description: 'Only detect drift and unmasked secrets without writing files to disk (dry-run)'
    required: false
    default: 'false'

outputs:
  source_ecosystem:
    description: 'The detected source ecosystem (cursor, claude, gemini, openai)'
  parity_score:
    description: 'The certified AST semantic parity score (e.g. 98.5%)'
  redacted_secrets:
    description: 'Total number of sensitive credentials masked in RAM'

runs:
  using: 'composite'
  steps:
    - name: Run PromptShift Transpiler & Parity Verification
      shell: bash
      env:
        PROMPTSHIFT_LICENSE_KEY: ${{ inputs.key }}
      run: |
        EXTRA_FLAGS=""
        if [ "${{ inputs.check_only }}" = "true" ]; then
          EXTRA_FLAGS="--dry-run"
        fi
        node "${{ github.action_path }}/packages/cli/bin/promptshift.js" --to="${{ inputs.target }}" $EXTRA_FLAGS

branding:
  icon: 'arrow-right-circle'
  color: 'cyan'
